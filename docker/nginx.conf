server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # O nome "api" é resolvido só na hora da requisição, pelo DNS interno do Docker.
    # Sem isso o nginx tenta resolver na subida e não inicia quando o container da API
    # ainda não existe, nem quando a imagem é rodada sozinha, fora do compose.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://api:8080;

    # Tudo que é da API vai para o container "api" do compose de produção.
    # Sem parte de URI no proxy_pass, a requisição segue com o caminho original.
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Sobrescreve, não acrescenta: o Tomcat confia no cabeçalho quando a conexão vem de rede
        # interna, e um valor vindo do cliente driblaria o limite de tentativas de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /oauth2/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Sobrescreve, não acrescenta: o Tomcat confia no cabeçalho quando a conexão vem de rede
        # interna, e um valor vindo do cliente driblaria o limite de tentativas de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /login/oauth2/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Sobrescreve, não acrescenta: o Tomcat confia no cabeçalho quando a conexão vem de rede
        # interna, e um valor vindo do cliente driblaria o limite de tentativas de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /actuator/health {
        proxy_pass $api;
    }

    # SPA: qualquer rota desconhecida cai no index.html e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
        # Cabeçalhos de segurança só nas páginas e arquivos do app; as respostas da API levam os
        # do Spring Security. Uma CSP completa precisaria do hash do script de tema do index.html e
        # de liberar os workers do Monaco; aqui ela só proíbe abrir o app dentro de um iframe.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
